# Host-loop canary: proves shell routes through mcp__workspace__bash (not native Bash)
# and that a bare $CLAUDE_PLUGIN_ROOT is empty in the workspace bash (the variable is not set there).
baseline: latest
session: ../sessions/skill.yaml
fidelity: hostloop
prompt: |
  Run a shell command that prints CLAUDE_PLUGIN_ROOT and checks if it exists.
  Reply exactly: "hostloop ok" when done.
assert:
  - result: success
  - tool_called: mcp__workspace__*
  # NO `tool_not_called: Bash` here. It read as the other half of the canary's claim, but hostloop does
  # not serve `Bash` at all — it is disallowed and aliased to mcp__workspace__bash — so the assertion
  # could never have been violated and proved nothing. `tool_called: mcp__workspace__*` above is the
  # whole signal: the shell DID route through the workspace tool. The harness now refuses the vacuous
  # form at load.
