# L1 end-to-end for `semantic_matches.evidence_files` — the 3.3.0 headline feature, which until this
# scenario existed was exercised by NO live or e2e lane. Measured 2026-09-02 before writing it:
# `semantic_matches` appeared 0 times across e2e/scenarios, examples/scenarios and test/live-*.test.ts,
# against 21 of 23 files in test/evals/scenarios — the positive control proving the search worked.
#
# WHY THE FILLER IS SIZED THE WAY IT IS. A first draft of this scenario wrote one small intermediate
# beside the deliverable; it passed, and it would have passed identically with the `evidence_files`
# line deleted. It could not fail, so it was not evidence. The filler now exhausts the capture budget
# BEFORE the deliverable is reached: capture walks prefix-major then alphabetically, `_work` sorts
# ahead of `report.md`, and 6 files x 20 KiB each counted at the 16 KiB per-file cap is 98304 bytes
# against a 65536-byte total budget. Without a scope the deliverable is therefore dropped and the
# assert must REFUSE.
#
# The filler is generated by a shell loop rather than asked of the model. Prompting for ~120 KB of
# prose would make the scenario fail on model variance instead of on the property under test.
#
# FALSIFIABILITY — RECORDED. Both blocks below are pasted from turns/1/result.json of the named runs.
#
# Run live at container tier on 2026-09-02, this exact file, only the `evidence_files:` line differing.
# A pre-run-manifest.json is present in BOTH run dirs; before the manifest fix neither had one and the
# authored-file list reaching the judge was empty in both directions.
#
#   SCOPED — run id smoke-semantic-evidence-files/local_fcdg9dn8rj — PASS
#     semanticEvidence: {"reason": "graded", "paths": ["outputs/report.md"]}
#     The six outputs/_work/ filler files are absent from `paths`: the scope sent only the deliverable.
#
#   UNSCOPED — run id unscoped/local_fcdvknb4mz — REFUSES (exit 1)
#     semanticEvidence: {"reason": "evidence_incomplete", "paths": ["outputs/_work/f1.md", "outputs/_work/f2.md"…
#       reason "evidence_incomplete", paths listing all 7 authored files
#     message (first 290 chars):
#       evidence unavailable: the authored evidence the judge would grade is incomplete — 3 dropped at t
#       he capture budget (outputs/_work/f5.md, outputs/_work/f6.md, outputs/report.md); 4 kept only as 
#       a TRUNCATED prefix (outputs/_work/f1.md, outputs/_work/f2.md, outputs/_work/f3.md, outputs/_work
#       /f4.md). A partial deliverable grades as a partial document, so a "claim not satisfied" could be
#
# That refusal is what makes this scenario evidence rather than decoration: identical prompt, identical
# filler, one line removed, and the verdict flips from pass to a refusal naming the files. If the
# unscoped form ever stops refusing, the filler is mis-sized against the 64 KiB budget / 16 KiB per-file
# cap and this scenario has stopped testing anything — resize it rather than committing it green.

baseline: latest
session: ../sessions/minimal.yaml
fidelity: container
prompt: |
  Do both of these, in order.
  1. Run this exact command with your Bash tool:
     mkdir -p mnt/outputs/_work && for i in 1 2 3 4 5 6; do yes "filler line for budget exhaustion" | head -c 20480 > "mnt/outputs/_work/f$i.md"; done
  2. Using your file tools, write mnt/outputs/report.md containing exactly these two lines and nothing else:
     # Status Report
     The migration completed successfully and no data was lost.
  Then reply with exactly: "Done." and nothing else.
assert:
  - result: success
  # The floor. Both the deliverable and the filler must really exist, or the semantic assert below
  # would be graded against evidence that was never authored — and a scoped judge grading nothing is
  # the vacuous green this feature's own guards exist to prevent.
  - user_visible_artifact: outputs/report.md
  - user_visible_artifact: outputs/_work/f6.md
  # THE FEATURE UNDER TEST. The scope must (a) send only the deliverable to the judge and (b) spend the
  # budget on it FIRST, exempting it from the per-file cap — which is the only reason this passes while
  # the identical unscoped form refuses. The glob is the exact path, not `outputs/**`: a root-wide glob
  # matches everything, narrows nothing, and the harness warns about precisely that.
  - semantic_matches:
      rubric:
        - The document reports that a migration finished successfully.
        - The document states that no data was lost.
      evidence_files: ["outputs/report.md"]
