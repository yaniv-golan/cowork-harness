# e2e session for the host-loop canary: mounts a plugin purely so the canary runs with a plugin
# in the session (it prints CLAUDE_PLUGIN_ROOT from the workspace bash, where the variable is unset).
# Reuses the example my-pdf-skill cross-tree — the canary needs *a* mounted plugin, not a
# specific one. Paths resolve relative to THIS file's dir (see docs/session.md "Path expansion").
permission_mode: default
# A run must state its model; the e2e lane uses the cheaper one.
model: claude-sonnet-5
permission_parity: cowork
plugins:
  local_plugins:
    - ../../examples/skills/my-pdf-skill
