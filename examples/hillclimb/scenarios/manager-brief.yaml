# The brief as a manager reads it, judged head to head against a frozen earlier brief, in both orders.
name: manager-brief
baseline: latest
session: ../sessions/sales-brief.yaml
fidelity: container
# An unscripted question gets its first option and a Cowork dialog is cancelled; tool permissions follow `answers:`
# below and the harness's defaults. Keeps a round unattended.
on_unanswered: first
# Bash runs unless it deletes, fetches or installs.
answers:
- when_tool: Bash
  allow_if: '!/\brm\b/.test(command) && !command.includes("curl") && !command.includes("pip")'
  else: deny
prompt: Use the sales-brief skill on orders.csv from my uploads. The brief goes to our sales manager, who has five minutes for it.
assert:
- user_visible_artifact: outputs/brief.md
- semantic_pairwise:
    order: both
    evidence_files: [outputs/brief.md]
    rubric:
    - Leads with the most important number
    - Every point is grounded in a number from the data
    - Ends with a concrete recommended action
    - Can be read in five minutes
# A presence check more than a goal: it is reported only when the profiler's metrics.json reaches outputs/.
metrics:
- {id: amount_total, artifact: outputs/metrics.json, path: columns.amount.sum, better: lower, unbounded: true}
