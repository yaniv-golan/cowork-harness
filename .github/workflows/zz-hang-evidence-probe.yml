# THROWAWAY — remove before merge. Proves the hang-evidence wiring on a real runner: the artifact upload after a
# step-timeout and after a job-timeout, gdb dumps from the job-level dumper, and the in-suite watchdog on Linux.
name: zz-hang-evidence-probe
on:
  push:
    branches: [fix/r105-sync-child-watchdog]
permissions:
  contents: read
jobs:
  step-timeout:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install gdb
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends gdb
      - name: Arm the job-level hang dump
        run: |
          mkdir -p "$RUNNER_TEMP/hangs"
          nohup scripts/ci/hang-dump.sh 30 "$RUNNER_TEMP/hangs" >"$RUNNER_TEMP/hangs/hang-dump.out" 2>&1 &
      - name: A step that hangs past its own limit
        timeout-minutes: 1
        run: |
          set -o pipefail
          node -e "setTimeout(() => {}, 600000)" 2>&1 | tee "$RUNNER_TEMP/hangs/vitest.log"
      - name: Upload
        if: ${{ always() && !success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-step-timeout
          path: ${{ runner.temp }}/hangs
          if-no-files-found: ignore
          retention-days: 3

  job-timeout:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Arm the job-level hang dump
        run: |
          mkdir -p "$RUNNER_TEMP/hangs"
          nohup scripts/ci/hang-dump.sh 40 "$RUNNER_TEMP/hangs" >"$RUNNER_TEMP/hangs/hang-dump.out" 2>&1 &
      - name: A step the JOB limit cancels
        run: node -e "setTimeout(() => {}, 600000)"
      - name: Upload
        if: ${{ always() && !success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-job-timeout
          path: ${{ runner.temp }}/hangs
          if-no-files-found: ignore
          retention-days: 3

  in-suite-watchdog:
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - run: npm ci
      - name: Install gdb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends gdb
      - name: An induced sync-child hang must fail red with a dump
        env:
          COWORK_TEST_HANG_DIR: ${{ runner.temp }}/hangs
          COWORK_TEST_HANG_T_MS: "5000"
        run: |
          mkdir -p test/_probe
          printf '%s\n' 'import { spawnSync } from "node:child_process";' 'import { it } from "vitest";' 'it("hangs", () => { spawnSync("sh", ["-c", "sleep 600"]); });' > test/_probe/hang.test.ts
          if npx vitest run test/_probe/hang.test.ts --testTimeout=1000 > "$RUNNER_TEMP/probe.log" 2>&1; then echo "::error::expected red"; cat "$RUNNER_TEMP/probe.log"; exit 1; fi
          cat "$RUNNER_TEMP/probe.log"
          grep -q "watchdog's limit: sleep 600" "$RUNNER_TEMP/probe.log"
          ls -R "$RUNNER_TEMP/hangs"
          grep -l "Thread" "$RUNNER_TEMP"/hangs/run-*/*/stacks-*-fork.txt
      - name: The watchdog guard tests
        run: npx vitest run test/sync-child-watchdog.test.ts test/sync-child-wrap.test.ts test/ci-hang-dump.test.ts
      - name: Upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-in-suite-node${{ matrix.node }}
          path: ${{ runner.temp }}/hangs
          if-no-files-found: warn
          retention-days: 3
