name: release

# Cut a release via the branch→PR→merge→tag flow in RELEASING.md. Tag the MERGE COMMIT (main HEAD
# after `gh pr merge`), NOT a release-branch head: the publish gate below (require-ci-success) looks
# for a PUSH-event ci.yml run for the tagged SHA, and a branch/PR head only has a pull_request run.
# Do NOT `npm version && git push --follow-tags` from a release branch — that tags the branch head.
# A pushed `vX.Y.Z` tag (matching package.json) builds, tests, publishes to npm with
# provenance, and creates a GitHub Release. Auth is npm Trusted Publishing (OIDC) —
# no NPM_TOKEN secret: configure cowork-harness's trusted publisher on npmjs.com
# (GitHub repo yaniv-golan/cowork-harness + workflow `release.yml`).
on:
  push:
    # Full semver tags only (incl. prereleases like v1.0.4-rc.1). The floating Marketplace
    # aliases (v1, v1.0) must NOT trigger a publish — they'd only die at the version guard.
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm provenance (OIDC)
  actions: read # query ci.yml's conclusion for this commit (publish gate)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The publish gate must be no weaker than the merge gate. `npm run ci` (below) is TS-only;
      # ci.yml also runs pytest, format, the replay gate, boundary + scenario suites. So require
      # ci.yml to have SUCCEEDED for this exact commit before publishing. Polls (up to ~30 min) so
      # `git push --follow-tags` (commit + tag together) works even if ci.yml is still running.
      # Shared with publish-image.yml so the two publish gates can't drift.
      - name: Require ci.yml success for this commit
        uses: ./.github/actions/require-ci-success

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      # Trusted Publishing (OIDC) requires npm >= 11.5.1; the Node runtime ships an older npm, so pull a
      # newer one. Pin to npm 11 (latest major) rather than @latest: npm 12.0.0 shipped broken for our use
      # — it needs Node >= 22 AND its --provenance path fails with a missing `sigstore` module. 11.x is
      # OIDC-capable and stable; revisit the pin when a 12.x is known-good.
      - name: Use a trusted-publishing-capable npm
        run: npm install -g npm@11

      - run: npm ci

      - name: Verify the tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"; exit 1
          fi

      - name: Verify CHANGELOG has a heading for this version
        run: |
          V="${GITHUB_REF_NAME#v}"
          V_ESC="$(printf '%s' "$V" | sed 's/\./\\./g')"
          grep -qE "^## \[$V_ESC\]" CHANGELOG.md \
            || { echo "::error::no '## [$V]' heading in CHANGELOG.md"; exit 1; }

      - name: Version lockstep guard (npm package <-> companion skill)
        run: npm run check:versions

      - name: Build + test (also runs via prepublishOnly)
        run: npm run ci

      # STAGED PUBLISH — deliberately NOT `latest`.
      #
      # `npm publish` with no `--tag` writes `latest`, so a release became the default install for every
      # unpinned consumer the instant CI succeeded, with no human between the two. 2.0.0 reached everyone
      # that way — a breaking hash-format epoch, plus a flagship replay that exits 1 from an npm install —
      # and `latest` had to be rolled back to 1.25.0 by hand afterwards.
      #
      # Publishing to `next` makes promotion an explicit act. The version is fully published and
      # installable as `cowork-harness@next` or by exact version; it is simply not what a bare
      # `npm i cowork-harness` (or the Action's `version: latest` default) resolves to until promoted.
      # Promotion is a documented step in RELEASING.md and needs a 2FA challenge, which is the point.
      - name: Publish to npm (Trusted Publishing + provenance, staged on `next`)
        run: npm publish --provenance --access public --tag next

      - name: Extract this version's CHANGELOG section
        run: |
          V="${GITHUB_REF_NAME#v}"
          # Print the lines under `## [V]` up to (not including) the next `## [` heading.
          # `index(...)==1` matches the literal heading start, so dots in V need no escaping.
          awk -v ver="$V" '
            index($0, "## [" ver "]") == 1 { f=1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          # Fail-safe: the "Verify CHANGELOG has a heading" step above already guarantees the section,
          # but never ship an empty body — fall back to an absolute CHANGELOG link.
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md) for the release notes." > RELEASE_NOTES.md
          fi
          echo "----- RELEASE_NOTES.md -----"; cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # The CHANGELOG section becomes the body; generate_release_notes appends the
          # auto "Full Changelog" compare link below it (softprops pre-pends `body`).
          generate_release_notes: true
          body_path: RELEASE_NOTES.md

      # MOVE THE MARKETPLACE ALIAS TAGS. Manual before this, and it lapsed: `v1` sat at 1.24.0 through two
      # releases because moving it was a checklist line someone had to remember. The Action's consumers pin
      # `@v1`/`@v1.0`, so a stale alias is a promise the repo stops keeping silently.
      #
      # Runs LAST, after publish and the GitHub Release: an alias is a pointer to a release that already
      # exists, and a failure here must never be able to half-publish anything.
      #
      # Two guards, both of which a hand-run `git tag -f` skips:
      #   * PRERELEASE tags never move an alias. The trigger accepts `v1.0.4-rc.1`, and pointing `v1` at an
      #     rc would hand every `@v1` consumer a prerelease.
      #   * NEVER MOVE BACKWARDS. Releasing a 1.25.1 patch after 2.0.1 exists should move `v1`/`v1.25`
      #     forward and leave `v2` alone — which falls out of deriving the aliases from the released
      #     version. But re-releasing an OLDER patch on a line (a 1.20.5 after 1.25.0) must NOT drag `v1`
      #     back, so each alias only moves when this release is the highest on the line it names.
      - name: Move the major/minor alias tags (vX, vX.Y)
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#v}"
          case "$V" in
            *-*) echo "::notice::$GITHUB_REF_NAME is a prerelease — leaving alias tags untouched"; exit 0 ;;
          esac
          MAJOR="${V%%.*}"; MINOR="${V#*.}"; MINOR="${MINOR%%.*}"
          git fetch --tags --force --quiet
          highest() { # highest stable release tag matching $1, or empty
            git tag -l "$1" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1
          }
          for spec in "v${MAJOR}:v${MAJOR}.*.*" "v${MAJOR}.${MINOR}:v${MAJOR}.${MINOR}.*"; do
            alias="${spec%%:*}"; pattern="${spec#*:}"
            top="$(highest "$pattern")"
            if [ "$top" != "$GITHUB_REF_NAME" ]; then
              echo "::notice::$alias unchanged — $top is the highest on that line, not $GITHUB_REF_NAME"
              continue
            fi
            git tag -f "$alias" "$GITHUB_REF_NAME"
            git push -f origin "refs/tags/$alias"
            echo "::notice::$alias -> $GITHUB_REF_NAME"
          done
