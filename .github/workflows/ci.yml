name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, but NEVER a run on `main`. A `main` run is what `require-ci-success`
  # consults for the tagged/dispatched SHA, so cancelling one turns a perfectly good commit into an
  # unpublishable one — it reads `conclusion: cancelled`, not `success`. Observed twice on 2026-08-06/07:
  # merging a second PR minutes after the first left the earlier merge commit cancelled, and the publish
  # gate correctly refused it. PR runs stay cancellable, which is where the cost saving actually is.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ── Stage 1: static checks + build + token-free smoke (fast gate; no Docker, no secrets).
  # The heavy unit suite is sharded into the `test` matrix below, so this stays quick and everything
  # downstream can start after it instead of idling ~15 min behind the tests. ──
  build:
    name: build · typecheck · guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Version lockstep guard (npm package <-> companion skill)
        run: npm run check:versions
      - name: Skill doc-link guard (no dangling docs/*.md pointer in the plugin payload)
        # A plugin install materializes ONLY .claude/skills/<name>/** — docs/ ships in the npm tarball,
        # not the plugin cache — so a bare `docs/x.md` reference inside the skill is a dead pointer for
        # every plugin-install consumer. Cost a real consumer hours (see scripts/check-skill-doc-links.ts).
        run: npm run check:skill-doc-links
      - name: Format check
        run: npm run format:check
      - name: CLI parsing-idiom guard (no silent positional-grab)
        # The first-non-dash-token scan silently grabbed a flag's value as the positional and swallowed
        # unknown flags. Commands resolve positionals via positionals()/parseArgs instead; ban a regression.
        # (The comprehensive enforcement is test/cli-structural-guard.test.ts — every command must reject an
        # unknown flag — which runs under `npm test` below.)
        run: |
          if grep -rEn 'args\.find\(.*startsWith\("--"' src/; then
            echo "::error::Forbidden CLI parsing idiom (first-non-dash-token scan). Use positionals()/parseArgs."
            exit 1
          fi
      - name: Single-source guard (resolveAgentBinary)
        # The agent-binary resolver (with the newest-staged fallback) must be defined ONLY in src/baseline.ts.
        # It was once duplicated inline in container.ts/hostloop.ts without the fallback, so the fallback was
        # dead on the real runtime paths. Ban a second definition. (test/agent-binary-single-source.test.ts
        # also covers this.)
        run: |
          if grep -rEn 'function resolveAgentBinary|const resolveAgentBinary[[:space:]]*=' src/ | grep -vE '^src/baseline\.ts:'; then
            echo "::error::resolveAgentBinary must be defined only in src/baseline.ts (import it; don't re-duplicate)."
            exit 1
          fi
      - name: CLI error-envelope guard (usage/runtime errors must use fail(), not a bare process.exit)
        # A bare `process.exit(1|2)` in src/cli.ts / src/run/doctor.ts outside fail()'s own definition means
        # a new command bypassed the shared JSON envelope (the 2026-07 agent-friendliness audit finding).
        # New catch blocks must call fail(command, category, message, hint, json[, exitCode]) instead.
        # Sites that legitimately keep a raw process.exit (a custom, non-jsonError wire shape) must carry
        # the `cli-error-envelope-exempt` marker comment on the same line — the guard excludes those.
        # (fail() itself lives in src/run/envelope.ts, outside this grep's scope, so no self-match to exclude.)
        run: |
          if grep -n "process\.exit([12])" src/cli.ts src/run/doctor.ts src/run/cassette.ts \
             | grep -v "cli-error-envelope-exempt"; then
            echo "::error::Found a bare process.exit(1|2) outside fail() with no cli-error-envelope-exempt marker — route it through fail(...) instead, or add the marker if it's a deliberate custom-shape exception."
            exit 1
          fi
      - name: Typecheck
        run: npm run typecheck
      # Build feeds the token-free smoke below AND the sharded `test` job (each shard rebuilds). ~45 test
      # files gate CLI-integration cases on `existsSync("dist/cli.js")` via describe.skipIf, so any job
      # that runs those tests MUST build first or they silently skip to a false green — the `test` job
      # re-asserts this with a loud guard.
      - name: Build
        run: npm run build
      - name: Validate CLI wiring
        run: node dist/cli.js list
      - name: Token-free replay gate (example-pdf-skill fixture)
        run: node dist/cli.js replay examples/replays/example-pdf-skill.cassette.json --output-format json
      - name: Token-free replay gate (multiselect gate/controlOut fixture)
        run: node dist/cli.js replay examples/replays/example-multiselect-gate.cassette.json --output-format json
      - name: Token-free replay gate (hostloop computer-links fixture)
        # The ONLY committed cassette at effectiveFidelity:hostloop — the newest/headline tier, which
        # the token-free replay lane otherwise never exercises. Also the replay-side check that a
        # computer:// link resolves (computer_links_resolve) at hostloop.
        run: node dist/cli.js replay examples/replays/hostloop-computer-links.cassette.json --output-format json
      - name: Cassette privacy + staleness scan (committed fixtures)
        # No --allow-* flags needed: isCapabilityManifest() (src/run/cassette.ts) suppresses domain/currency
        # noise on all four capability-manifest forms — system/init, the init-1 registry control_response,
        # and (as of the MCP-handshake false-positive fix) the MCP initialize control_request/control_response
        # pair, whose clientInfo.websiteUrl/serverInfo previously tripped a `domain` finding on `claude.com`
        # in every MCP-session cassette. The scanner's `path`/`email` classes also run clean on these fixtures
        # with no allow needed — the synthetic placeholders used in example-multiselect-gate.cassette.json's
        # scrubbed fields (see its git history) don't collide with any default pattern. A NEW/different
        # finding of any class still fails the gate.
        run: node dist/cli.js verify-cassettes examples/replays/
      - name: Cassette scan covers every TRACKED cassette, not just examples/replays/
        # The step above scans one DIRECTORY. Nothing enforced that the directory is where the tracked
        # cassettes actually are, so a cassette committed anywhere else was gated by nothing at all — not
        # by CI (out of scope) and not by .githooks/pre-commit. This step closes that by deriving the set
        # from git rather than from a hard-coded path.
        #
        # Two ways the naive one-liner goes vacuously green, both avoided below:
        #   - `git ls-files … | xargs -r verify-cassettes` exits 0 on ZERO matches, so the day the pathspec
        #     stops matching this reports success while scanning nothing. Hence the explicit total count.
        #   - `--out` takes an arbitrary path with no suffix validation, so a `.json` recording is invisible
        #     to a `*.cassette.json` pathspec. Hence the CONTENT-derived denominator (`generator` field),
        #     cross-checked against the suffix-derived one.
        run: |
          set -euo pipefail
          # EXCLUSION, one entry, with its reason. test/evals/files/report-check.cassette.json is not a
          # recording: it is an eval ATTACHMENT, uploaded to the model under test by eval 7 to ask which
          # tier a cassette recorded at. It carries a hand-written `skillHash: sha256:synthetic-eval-fixture`
          # and a pinned old baseline ON PURPOSE, and it has no `scenario.session`, so `readCassette`
          # rejects its shape before the privacy scan can run. Measured, not assumed: adding a `session`
          # field does NOT make it verifiable — it converts the exit 3 into an exit 1 on `[stale] baseline
          # moved desktop-1.18286.0 -> current`, i.e. it would red this job on a fixture that is never
          # re-recorded. `--skip-staleness` does not help either; the shape gate runs first.
          # RESIDUAL, stated rather than papered over: this file is therefore NOT privacy-scanned by
          # anything. It is 1.2KB and hand-authored, but that is a property of today's content, not a
          # guarantee — if it is ever regenerated from a real recording it must be re-scanned by hand or
          # given a `scenario.session` and a re-record.
          EXCLUDE='^test/evals/files/report-check\.cassette\.json$'

          by_suffix=$(git ls-files '*.cassette.json' | sort)
          by_content=$(git grep -l '"generator": *"cowork-harness"' -- '*.json' | sort)
          if [ "$by_suffix" != "$by_content" ]; then
            echo "✖ tracked cassettes disagree by suffix vs by content — a recording was written to a path"
            echo "  the *.cassette.json pathspec cannot see (record --out does not validate the suffix)."
            diff <(printf '%s\n' "$by_suffix") <(printf '%s\n' "$by_content") || true
            exit 1
          fi

          total=$(printf '%s\n' "$by_suffix" | grep -c . || true)
          if [ "$total" -eq 0 ]; then
            echo "✖ zero tracked cassettes found — the pathspec stopped matching; this job would have"
            echo "  passed while scanning nothing. Fix the pathspec, do not delete this check."
            exit 1
          fi
          echo "tracked cassettes: $total"

          residual=$(printf '%s\n' "$by_suffix" | grep -v '^examples/replays/' | grep -Ev "$EXCLUDE" || true)
          if [ -z "$residual" ]; then
            echo "no tracked cassettes outside examples/replays/ (beyond the documented exclusion)"
            exit 0
          fi
          echo "$residual" | while read -r c; do
            [ -n "$c" ] || continue
            echo "scanning $c"
            node dist/cli.js verify-cassettes "$c"
          done
      - name: Lint example scenarios (no-silent-false-green invariants)
        # --strict makes a finding FAIL; --min-severity WARN scopes that to ERROR+WARN so the
        # advisory INFO class stays advisory. Without the pair, every WARN-class rule was decoration:
        # `cmd_lint` exits non-zero only on `has_error or (strict and findings)`, so a rule like
        # vacuous-gate-assert could fire on the corpus and CI would still be green. Bare --strict
        # would red today on 6 pre-existing INFOs.
        run: node dist/cli.js lint examples/scenarios/*.yaml examples/scenarios/trigger-accuracy-sweep/*.yaml e2e/scenarios/*.yaml --strict --min-severity WARN

  # ── Stage 1a: the heavy unit suite, SHARDED across parallel runners (the former `unit` 15-min pole).
  # 4328 tests; ~45 files gate CLI-integration cases on dist/cli.js via describe.skipIf — each shard
  # rebuilds (build is ~5s) and FAILS LOUD if dist/cli.js is missing, so those cases can never silently
  # skip to a false green. Pool stays vitest's default `forks`: tests write a per-process runs-root
  # (test/setup/runs-root.ts), so a shared-context `threads` pool would cross-contaminate them. ──
  test:
    name: unit tests (sharded)
    runs-on: ubuntu-latest
    needs: build
    # Hard backstop: a hung shard fails here instead of running to GitHub's 6h default. A test that
    # spawns a CLI subprocess which blocks (waiting on stdin / a gate / a channel) hangs SYNCHRONOUSLY,
    # and vitest's per-test testTimeout cannot interrupt a blocked sync call — only a wall-clock kill can.
    timeout-minutes: 12
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Build (the CLI-integration cases spawn dist/cli.js)
        run: npm run build
      - name: Fail LOUD if dist/cli.js is missing (never let skipIf false-green a shard)
        run: test -f dist/cli.js || { echo "::error::dist/cli.js missing after build — CLI-integration cases would silently skip."; exit 1; }
      - name: Unit tests — shard ${{ matrix.shard }}/4
        # `timeout` bounds the whole shard: SIGTERM at 10 min, SIGKILL 30s later. This is the guard
        # that turns an indefinite hang into a loud failure with the captured log — belt to the job's
        # `timeout-minutes` suspenders. --preserve-status surfaces vitest's real exit code on a clean run.
        run: timeout --preserve-status --signal=SIGTERM --kill-after=30s 600 npx vitest run --shard=${{ matrix.shard }}/4

  # ── Stage 1a: packaged Action self-test (uses: ./ against THIS commit, packed as a tarball —
  # never against whatever's currently published on npm) ─────────────────────────
  action-self-test:
    name: "Action self-test (uses: ./)"
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "24", cache: npm }
      - run: npm ci && npm run build
      - name: Pack this commit (the action must install THIS code, not the last npm publish)
        id: pack
        run: |
          npm pack --pack-destination /tmp >/dev/null
          echo "tarball=$(ls /tmp/cowork-harness-*.tgz)" >> "$GITHUB_OUTPUT"
      - name: Run the action against the committed pass-case fixture
        id: passcase
        uses: ./
        with:
          command: replay
          path: examples/replays/example-pdf-skill.cassette.json
          version: ${{ steps.pack.outputs.tarball }}
      - name: Verify the reporter actually ran
        # $GITHUB_STEP_SUMMARY is scoped to THIS action invocation's own steps (all composite
        # sub-steps share one file), so a later, separate workflow step gets a fresh, empty file and
        # can never read back what the action wrote — check the summary-md OUTPUT instead.
        run: |
          if [ -z "${{ steps.passcase.outputs.summary-md }}" ]; then
            echo "::error::action-self-test: summary-md output is empty — the reporter didn't write anything."
            exit 1
          fi
      - name: Run the action against a nonexistent path (must fail — proves exit-code propagation)
        id: failcase
        continue-on-error: true
        uses: ./
        with:
          command: replay
          path: examples/replays/this-cassette-does-not-exist.json
          version: ${{ steps.pack.outputs.tarball }}
      - name: Verify the failing case actually failed
        # continue-on-error above masks the step's own exit code so this job can inspect it instead
        # of dying immediately — this assertion is the point of the whole failing-case step.
        run: |
          if [ "${{ steps.failcase.outcome }}" != "failure" ]; then
            echo "::error::action-self-test: expected the nonexistent-path invocation to fail, got outcome='${{ steps.failcase.outcome }}'"
            exit 1
          fi
      - name: Run the action against a deliberately-failing ASSERTION (distinct from the usage
          error above — proves exit 1 / verdict-fail propagates, not just exit 2 / usage errors)
        id: assertfailcase
        continue-on-error: true
        uses: ./
        with:
          command: replay
          path: examples/replays/example-pdf-skill.cassette.json
          version: ${{ steps.pack.outputs.tarball }}
          extra-args: "--assert-from examples/replays/example-pdf-skill-ci-selftest-failing.yaml"
      - name: Verify the assertion-failure case actually failed, and the reporter rendered a fail row
        env:
          # steps.assertfailcase.outputs.summary-md, not $GITHUB_STEP_SUMMARY — that file is scoped
          # to the assertfailcase step's own invocation; this (separate) step would see a fresh, empty one.
          SUMMARY_MD: ${{ steps.assertfailcase.outputs.summary-md }}
        run: |
          if [ "${{ steps.assertfailcase.outcome }}" != "failure" ]; then
            echo "::error::action-self-test: expected the deliberately-failing assertion to fail, got outcome='${{ steps.assertfailcase.outcome }}'"
            exit 1
          fi
          # This step's summary-md is just the assertfailcase invocation's own row (not cumulative
          # across the job's earlier steps — each action invocation renders only its own run).
          if ! grep -qE "example-pdf-skill.*❌ fail" <<< "$SUMMARY_MD"; then
            echo "::error::action-self-test: reporter output doesn't show a failing verdict row for example-pdf-skill — the reporter may not be rendering assertion failures correctly."
            exit 1
          fi
      - name: Run the action with command:lint (proves the analyzer passthrough — --output-format json
          is stripped/translated to python's --json, not forwarded verbatim and rejected)
        id: lintcase
        uses: ./
        with:
          command: lint
          path: examples/scenarios/example-pdf-skill.yaml
          version: ${{ steps.pack.outputs.tarball }}
      - name: Verify the lint case exited clean with a well-formed envelope
        run: |
          if [ "${{ steps.lintcase.outputs.ok }}" != "true" ]; then
            echo "::error::action-self-test: command:lint expected ok=true, got '${{ steps.lintcase.outputs.ok }}' — see the 'Run the action with command:lint' step's log."
            exit 1
          fi
          if ! node -e 'if (typeof JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).ok !== "boolean") process.exit(1)' "${{ steps.lintcase.outputs.envelope-path }}"; then
            echo "::error::action-self-test: command:lint envelope is missing a boolean .ok field."
            exit 1
          fi
      - name: Run the action with command:analyze-skill (the other token-free analyzer — pure TS, no python3 involved)
        id: analyzecase
        uses: ./
        with:
          command: analyze-skill
          path: .claude/skills/cowork-harness
          version: ${{ steps.pack.outputs.tarball }}
      - name: Verify the analyze-skill case exited clean with a well-formed envelope
        run: |
          if [ "${{ steps.analyzecase.outputs.ok }}" != "true" ]; then
            echo "::error::action-self-test: command:analyze-skill expected ok=true, got '${{ steps.analyzecase.outputs.ok }}' — see the 'Run the action with command:analyze-skill' step's log."
            exit 1
          fi
          if ! node -e 'if (typeof JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).ok !== "boolean") process.exit(1)' "${{ steps.analyzecase.outputs.envelope-path }}"; then
            echo "::error::action-self-test: command:analyze-skill envelope is missing a boolean .ok field."
            exit 1
          fi

  # ── Stage 1b: pytest helper lane — token-free subset only, excludes @pytest.mark.cowork (no Docker/token; -m 'not cowork') ──
  python:
    name: pytest helper lane (-m 'not cowork')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.11" }
      - run: pip install pytest # PyYAML is bundled with scenario.py (_vendor/) — no separate install; this also exercises the vendored fallback path
      - name: Run the non-cowork (pure) helper tests
        working-directory: python
        run: pytest -m 'not cowork'

  # ── Stage 2: boundary parity (Docker; no API key needed — pure sandbox probes) ──
  boundary:
    name: boundary parity (L1 container)
    runs-on: ubuntu-24.04-arm # arm64 to match Cowork's linux/arm64 guest
    needs: build
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "24", cache: npm }
      - run: npm ci && npm run build
      - name: Agent base image — pull the digest docker/agent-image.json pins, else build
        # Our CI otherwise only ever `docker build`s this image, so a bad publish is invisible until
        # someone pulls it. Pull the PINNED digest and retag it to the local tag the probes use, so
        # boundary-check runs against the same bytes `doctor` validates and the README tells consumers
        # to pull. Falls back to a local build when the image is unavailable (a fork without package
        # read, or before the first publish).
        #
        # The earlier wording here said "the image the Action pins" and pulled the floating `:2` tag.
        # Both were wrong: `action.yml` pulls no image at all, and `:2` is not what anything pins —
        # so CI was certifying the last-published build while doctor certified the pin, and neither
        # said anything about the other.
        #
        # NOTE: the pull path HARD-FAILS on the canonical repo — a bad publish, or a pin naming a
        # digest that was never pushed, breaks this gate instead of silently rebuilding. Forks (no
        # package read / pre-publish) keep the local-build fallback with a warning. Written but not yet
        # verified headless: the image name / arch / GHCR read permission for the CI token still need a
        # real green run to confirm.
        run: |
          # Pull by the DIGEST recorded in docker/agent-image.json, not by the floating `:2` tag.
          #
          # Pulling the tag meant CI certified whatever was published last while `doctor` certified the
          # pin — so a green CI said nothing about the pinned image, and vice versa. Reading the pin
          # here makes CI, doctor, and the README's consumer instructions all validate the same bytes.
          # Read the pin with node, not jq: this job already runs setup-node + `npm ci`, so node is
          # guaranteed here, while jq would be the first bare use in this workflow and an assumption
          # about the runner image on a step that has never executed in CI.
          DIGEST=$(node -p 'require("./docker/agent-image.json").variants["cowork-agent-base:2"].digest')
          IMG="ghcr.io/${{ github.repository_owner }}/cowork-agent-base@${DIGEST}"
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
            echo "::error::docker/agent-image.json has no digest for cowork-agent-base:2 — the pin is the contract; fix it rather than falling back to the mutable tag."
            exit 1
          fi
          if docker pull --platform linux/arm64 "$IMG"; then
            docker tag "$IMG" cowork-agent-base:2
            echo "pulled and retagged $IMG → cowork-agent-base:2 (the PINNED image is what gets tested)"
          elif [ "$GITHUB_REPOSITORY" = "yaniv-golan/cowork-harness" ]; then
            echo "::error::GHCR pull of $IMG failed on the canonical repo — a bad publish, or a pin pointing at a digest that was never pushed, must fail this gate rather than silently rebuild."
            exit 1
          else
            echo "::warning::GHCR pull of $IMG failed (fork/pre-publish) — building locally as a fallback."
            docker build --platform linux/arm64 -t cowork-agent-base:2 -f docker/Dockerfile.agent .
          fi
      - name: Prove the sandbox enforces Cowork's limitations (self-contained sidecar)
        run: node dist/cli.js boundary-check
      - name: Live contract tests — guard the binary assumptions (free ON THIS RUNNER)
        # Requires the staged agent; only runs where it's present. Skips cleanly otherwise.
        #
        # "no token needed" was the old wording and it is only true HERE, on a Linux runner with no
        # credential store: every token-gated case skips, so the step is free. Do NOT carry that reading
        # to a developer machine — running this same command locally on macOS BILLS, because at hostloop
        # the agent self-sources credentials from the Keychain and an empty environment proves nothing.
        # The lane prints that warning itself now (vitest.config.live.ts's globalSetup).
        run: npm run test:live

  # ── Stage 3: live scenario suite (best-effort live inference; soft-skips without a key) ────
  scenarios:
    name: scenario suite (mixed protocol/container, live inference)
    runs-on: ubuntu-24.04-arm
    needs: [boundary, test]
    timeout-minutes: 30
    permissions:
      contents: read
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      # Runs now default to ~/.cowork-harness/runs (outside any working tree). Pin them back into the
      # workspace so `upload-artifact path: runs/` captures them. RELATIVE (not an absolute workspace path)
      # so it tracks any step's working-directory together with the upload path — an absolute/relative split
      # would silently upload an empty artifact (the upload is `if: always()`, so it would stay green).
      COWORK_HARNESS_RUNS_DIR: runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "24", cache: npm }
      - run: npm ci && npm run build
      - name: Guard — live inference is best-effort (soft-skip without a key)
        id: guard
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            # Best-effort: without a key the live suite soft-skips (green) on EVERY event, including
            # push to main and workflow_dispatch. It is NOT a publish gate — release.yml still requires
            # this ci run to be green, but a green check here is not proof of live validation (loud
            # marker below). Set the ANTHROPIC_API_KEY repo secret to actually run it.
            echo "::warning::ANTHROPIC_API_KEY not set — skipping live scenario suite (no live validation this run)."
            {
              echo "## ⚠️ Live scenario suite SKIPPED — NOT live-validated"
              echo ""
              echo "This run did **not** execute live inference. A green check on this job is **not**"
              echo "proof the scenarios pass against a real model."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "live=false" >> "$GITHUB_OUTPUT"
          else
            echo "live=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build agent base image (per-run egress sidecar is self-managed)
        if: steps.guard.outputs.live == 'true'
        run: docker build --platform linux/arm64 -t cowork-agent-base:2 -f docker/Dockerfile.agent .
      - name: Run example scenarios (L1 container — the user-facing worked examples)
        if: steps.guard.outputs.live == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node dist/cli.js run examples/scenarios/
      - name: Run e2e self-tests (L0 / L1 / hostloop — microvm excluded; needs a real VM)
        if: steps.guard.outputs.live == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          for s in smoke-askuserquestion smoke-multiselect smoke-multiselect-deciderdir smoke-l1-container smoke-l1-egress smoke-present-files smoke-semantic-evidence-files canary-hostloop; do
            node dist/cli.js run "e2e/scenarios/$s.yaml" || exit 1
          done
      - name: Verify run artifacts were produced (guards against a silent empty upload)
        if: steps.guard.outputs.live == 'true'
        run: |
          if [ -z "$(ls -A runs 2>/dev/null)" ]; then
            echo "::error::runs/ is empty after the scenario suite — COWORK_HARNESS_RUNS_DIR misconfigured (artifact upload would capture nothing)."
            exit 1
          fi
      - name: Upload run artifacts (transcripts, decisions, egress logs)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: run-artifacts
          path: runs/
          retention-days: 14

  # ── Stage 4: parity drift watch — can't diff live Desktop on CI (macOS-only app), so this
  # instead FAILS if the newest committed baseline is stale by wall-clock age, forcing a human
  # to re-run `sync` periodically rather than letting the baseline silently rot indefinitely. ──
  parity-drift:
    name: parity drift vs upstream Desktop
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # Fails on a stale (>90d) newest baseline AND on any baseline with an invalid / future
      # capturedAt (the inline `node -e` this replaced silently green-lit NaN and future timestamps,
      # and a single corrupt file could permanently disable the gate). Unit-tested — see
      # test/check-baseline-staleness.test.ts.
      - name: Baseline staleness gate (90-day ceiling on the newest committed baseline)
        run: npx tsx scripts/check-baseline-staleness.ts baselines
      - name: Note
        run: |
          echo "Platform baselines are synced from a developer's installed Claude Desktop via"
          echo "\`cowork-harness sync --diff\` (needs the macOS app — Cowork Desktop is macOS-only; not available on CI runners)."
          echo "The staleness gate above catches an ABANDONED baseline; it cannot catch a baseline that is"
          echo "merely stale relative to a Desktop release from yesterday — a human still has to run sync"
          echo "after every Desktop update. See docs/maintenance via README → Maintenance."

  floor:
    name: floor check (node 22 — the declared engines floor)
    runs-on: ubuntu-latest
    # Hard backstop, same reason the sharded `test` job carries one: a test that spawns a CLI subprocess
    # which blocks hangs SYNCHRONOUSLY, and vitest's per-test timeout cannot interrupt a blocked sync
    # call — only a wall-clock kill can. This job runs the suite UNSHARDED, the shape the `test` job's
    # own header calls "the former `unit` 15-min pole", so 40 is a generous backstop, not a target.
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned to the ENGINES FLOOR, deliberately behind the other jobs. Without this, the floor in
      # package.json is an unverified claim: everything green on 24 says nothing about whether the
      # package still runs where it says it does.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run ci

  # ── Stage 2: agent image recipe — COMPILE it, on every PR ──────────────────────────
  # `boundary` PULLS the published image (deliberately: it exercises the consumer path) and hard-fails
  # rather than falling back on the canonical repo, and the only other build lives in `scenarios`, which
  # soft-skips without ANTHROPIC_API_KEY. So before this job, a Dockerfile.agent change could go green
  # through the merge gate WITHOUT EVER BEING BUILT — `publish-image.yml` compiled it only after the
  # release tag, turning a broken recipe into a failed release instead of a failed PR.
  #
  # Both variants: `publish-image.yml` also publishes `cowork-agent-full` from this same Dockerfile via
  # COWORK_FULL_PARITY=1 (Layer B — tesseract/LibreOffice/opencv/onnxruntime). A base-only gate would let
  # a Layer-B-breaking edit through and die after the tag.
  #
  # NB any conditional here belongs on a STEP, never on the job: this job is in `ci-green.needs`, which
  # has no `if: always()`, so a SKIPPED job skips ci-green and the required `typecheck · test · build`
  # context never reports — leaving every PR unmergeable (see release-preflight.ts's orphaned-context
  # check, which exists because that happened here for 676 commits).
  image-recipe:
    name: agent image recipe (arm64 build)
    runs-on: ubuntu-24.04-arm # must match Cowork's linux/arm64 guest; x86 needs binfmt that is not set up
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the lean/core image (the default COWORK_AGENT_IMAGE)
        run: docker build --platform linux/arm64 -t cowork-agent-base:ci -f docker/Dockerfile.agent .
      - name: Build the full-parity image (COWORK_FULL_PARITY=1 — Layer B)
        run: |
          docker build --platform linux/arm64 --build-arg COWORK_FULL_PARITY=1 \
            -t cowork-agent-full:ci -f docker/Dockerfile.agent .

  # ── Aggregation gate: carries the `typecheck · test · build` status the branch ruleset requires,
  # kept meaningful after the unit→build+test split — green ONLY when the fast build gate, every unit
  # test shard AND the Node-22 floor check pass, so any of them going red blocks a merge exactly as the
  # old monolithic job did, with no ruleset change. (The separate `pytest cowork-lane …` required context
  # predates this and is already stale vs the `python` job's name — flagged for a ruleset fix.) ──
  ci-green:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    needs: [build, test, floor, image-recipe]
    permissions:
      contents: read
    steps:
      - run: echo "build gate + all unit-test shards + the node-22 floor check passed"
